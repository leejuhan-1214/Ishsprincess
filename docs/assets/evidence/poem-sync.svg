<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#177766" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 04 / POEM-SYNC</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">메모 폴더 동기화</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">파일 위치 / 사용 동의</text>
