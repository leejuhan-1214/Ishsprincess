<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">시 초안은 개인 메모 폴더의 자동 동기화로 작업 폴더에 복사됐다. 읽기 권한은 있지만 공개 사용 허락 필</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">드는 없다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
