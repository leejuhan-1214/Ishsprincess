<rect x="88" y="192" width="498" height="156" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="192" width="7" height="156" rx="2" fill="#177766" stroke="none"/><text x="112" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">원본 위치</text><text x="112" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">개인 메모 폴더</text><rect x="614" y="192" width="498" height="156" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="614" y="192" width="7" height="156" rx="2" fill="#177766" stroke="none"/><text x="638" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">자동 동기화 사본</text><text x="638" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">작업 폴더</text><line x1="586" y1="269" x2="614" y2="269" stroke="#177766" stroke-width="5"/><rect x="88" y="379" width="1024" height="65" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="407" font-size="20" fill="#565569" font-weight="700" text-anchor="start">파일 읽기</text><text x="353" y="407" font-size="24" fill="#252533" font-weight="650" text-anchor="start">권한 있음</text><rect x="88" y="449" width="1024" height="65" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="477" font-size="20" fill="#565569" font-weight="700" text-anchor="start">공개 사용 허락</text><text x="353" y="477" font-size="24" fill="#252533" font-weight="650" text-anchor="start">허락 필드 없음</text>
