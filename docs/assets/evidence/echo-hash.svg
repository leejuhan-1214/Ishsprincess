<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">AI 얼굴 파일의 복사본</title><desc id="description">사칭 작업은 예전 시연 자료에 포함된 얼굴 이미지 복사본을 사용했다. 현재 얼터에고의 실행 파일을 호출하지 않는다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#a24830" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 05 / ECHO-HASH</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">AI 얼굴 파일의 복사본</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">예전 시연 자료의 복사본</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 06</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#a24830" font-weight="800" text-anchor="start">얼굴 이미지 / 실행 파일</text>
<rect x="88" y="190" width="289" height="318" rx="12" fill="#eee9e5" stroke="#cdc0b4"/><rect x="156" y="233" width="154" height="130" rx="15" fill="#52434a" stroke="none"/><circle cx="204" cy="280" r="9" fill="#fff"/><circle cx="265" cy="280" r="9" fill="#fff"/><line x1="204" y1="322" x2="265" y2="322" stroke="#fff" stroke-width="5"/><text x="234" y="405" font-size="26" fill="#252533" font-weight="750" text-anchor="middle">이미지 복사본</text><text x="234" y="453" font-size="23" fill="#a24830" font-weight="750" text-anchor="middle">≠ 실행 프로그램</text><rect x="408" y="220" width="704" height="79" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="426" y="248" font-size="20" fill="#565569" font-weight="700" text-anchor="start">사칭 작업에 사용</text><text x="640.32" y="248" font-size="24" fill="#252533" font-weight="650" text-anchor="start">얼굴 이미지 복사본</text><rect x="408" y="304" width="704" height="79" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="426" y="332" font-size="20" fill="#565569" font-weight="700" text-anchor="start">복사본 출처</text><text x="640.32" y="332" font-size="24" fill="#252533" font-weight="650" text-anchor="start">예전 시연 자료</text><rect x="408" y="388" width="704" height="79" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="426" y="416" font-size="20" fill="#565569" font-weight="700" text-anchor="start">현재 얼터에고</text><text x="640.32" y="416" font-size="24" fill="#252533" font-weight="650" text-anchor="start">실행 파일 호출 없음</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#a24830" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">사칭 작업은 예전 시연 자료에 포함된 얼굴 이미지 복사본을 사용했다. 현재 얼터에고의 실행 파일을 호출</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">하지 않는다.</text>
<text x="76" y="768" font-size="15" fill="#565569" font-weight="500" text-anchor="start">작은 아바타는 파일 유형 표시이며 캐릭터 얼굴을 재현하지 않습니다.</text>
<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
