<rect x="88" y="191" width="492" height="316" rx="12" fill="#eef0f3" stroke="#bfcbd6"/><rect x="122" y="219" width="424" height="212" rx="12" fill="#fffdf8" stroke="#536c85"/><text x="334" y="278" font-size="32" fill="#252533" font-weight="750" text-anchor="middle">교실</text><line x1="123" y1="398" x2="295" y2="398" stroke="#536c85" stroke-width="7"/><line x1="374" y1="398" x2="546" y2="398" stroke="#536c85" stroke-width="7"/><rect x="295" y="366" width="79" height="63" rx="4" fill="#24639c" stroke="none"/><text x="334" y="406" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">정문</text><text x="334" y="466" font-size="23" fill="#252533" font-weight="700" text-anchor="middle">기록 범위: 정문 카드 리더</text><rect x="607" y="200" width="505" height="79" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="625" y="228" font-size="20" fill="#565569" font-weight="700" text-anchor="start">17:22</text><text x="773.65" y="228" font-size="24" fill="#252533" font-weight="650" text-anchor="start">황민혁 / 정문 입실</text><rect x="607" y="284" width="505" height="79" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="625" y="312" font-size="20" fill="#565569" font-weight="700" text-anchor="start">정문 퇴실</text><text x="773.65" y="312" font-size="24" fill="#252533" font-weight="650" text-anchor="start">기록 없음</text><rect x="607" y="368" width="505" height="79" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="625" y="396" font-size="20" fill="#565569" font-weight="700" text-anchor="start">이 파일의 범</text><text x="625" y="422" font-size="20" fill="#565569" font-weight="700" text-anchor="start">위</text><text x="773.65" y="396" font-size="24" fill="#252533" font-weight="650" text-anchor="start">정문 카드 리더만</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#24639c" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">17:22 황민혁의 정문 입실이 기록됐다. 정문 퇴실 기록은 없으며, 기록 범위는 정문 카드 리더뿐이다.</text>
<text x="76" y="768" font-size="15" fill="#565569" font-weight="500" text-anchor="start">평면도는 기록 범위를 설명하기 위한 도식입니다.</text>
<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
