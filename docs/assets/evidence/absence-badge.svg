<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">교실 출입 기록</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">교실 / 기록 범위</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 01</text>
