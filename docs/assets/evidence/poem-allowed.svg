<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">태훈이 전시 사용을 허락한 파일은 weather-note.txt 하나다. 날짜·구름량·관측 불가 조건만 있고 해당 </text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">시 문장은 없다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
