<rect x="88" y="191" width="1024" height="318" rx="12" fill="#f8fbf5" stroke="#b4c5be"/><text x="116" y="232" font-size="28" fill="#177766" font-weight="800" text-anchor="start">weather-note.txt</text><rect x="107" y="258" width="986" height="56" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="125" y="286" font-size="20" fill="#565569" font-weight="700" text-anchor="start">허락한 자료</text><text x="372" y="286" font-size="24" fill="#252533" font-weight="650" text-anchor="start">weather-note.txt 하나</text><rect x="107" y="319" width="986" height="56" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="125" y="347" font-size="20" fill="#565569" font-weight="700" text-anchor="start">포함 항목</text><text x="372" y="347" font-size="24" fill="#252533" font-weight="650" text-anchor="start">날짜 · 구름량 · 관측 불가 조건</text><rect x="107" y="380" width="986" height="56" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="125" y="408" font-size="20" fill="#565569" font-weight="700" text-anchor="start">시 문장</text><text x="372" y="408" font-size="24" fill="#252533" font-weight="650" text-anchor="start">포함되지 않음</text><rect x="107" y="441" width="986" height="56" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="125" y="469" font-size="20" fill="#565569" font-weight="700" text-anchor="start">사용 허락</text><text x="372" y="469" font-size="24" fill="#252533" font-weight="650" text-anchor="start">이 관측 설명 파일에 한함</text>
