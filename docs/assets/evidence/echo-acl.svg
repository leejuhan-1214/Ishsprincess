<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">서로 다른 발송 권한</title><desc id="description">얼터에고는 오프라인 분석 폴더만 읽는다. 사칭 발송은 별도 예약 작업 DEMO-PRESSURE가 학교 내부 알림 계정으로 실행됐다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#a24830" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 05 / ECHO-ACL</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">서로 다른 발송 권한</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">분석기 / 발송기</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 02</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#a24830" font-weight="800" text-anchor="start">서로 다른 프로그램 권한</text>
<rect x="88" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="192" width="7" height="143" rx="2" fill="#a24830" stroke="none"/><text x="112" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">얼터에고</text><text x="112" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">오프라인 분석 폴더 읽기</text><rect x="616" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="192" width="7" height="143" rx="2" fill="#a24830" stroke="none"/><text x="640" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">별도 예약 작업</text><text x="640" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">DEMO-PRESSURE</text><rect x="88" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="353" width="7" height="143" rx="2" fill="#a24830" stroke="none"/><text x="112" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">사칭 발송</text><text x="112" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">학교 내부 알림 계정</text><rect x="616" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="353" width="7" height="143" rx="2" fill="#a24830" stroke="none"/><text x="640" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">작업 관계</text><text x="640" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">분석과 발송은 별도 동작</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#a24830" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">얼터에고는 오프라인 분석 폴더만 읽는다. 사칭 발송은 별도 예약 작업 DEMO-PRESSURE가 학교 내부 알림 </text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">계정으로 실행됐다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
