<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 02 / SCORE-BASELINE</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">개인 기준 파일</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">reference 필드 비교</text>
