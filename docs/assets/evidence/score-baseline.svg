<rect x="88" y="196" width="1024" height="68" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="224" font-size="20" fill="#565569" font-weight="700" text-anchor="start">태우 행</text><text x="353" y="224" font-size="24" fill="#252533" font-weight="650" text-anchor="start">TAEWOO-S27 / 개인 기준</text><rect x="88" y="269" width="1024" height="68" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="297" font-size="20" fill="#565569" font-weight="700" text-anchor="start">나머지 학생</text><text x="353" y="297" font-size="24" fill="#252533" font-weight="650" text-anchor="start">REF-01 / 공통 기준</text><rect x="88" y="342" width="1024" height="68" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="370" font-size="20" fill="#565569" font-weight="700" text-anchor="start">개인 기준 결과</text><text x="353" y="370" font-size="24" fill="#252533" font-weight="650" text-anchor="start">99</text><rect x="88" y="415" width="1024" height="68" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="443" font-size="20" fill="#565569" font-weight="700" text-anchor="start">비교 조건</text><text x="353" y="443" font-size="24" fill="#252533" font-weight="650" text-anchor="start">같은 기준 파일을 사용하지 않음</text><line x1="347" y1="262" x2="1080" y2="262" stroke="#946011" stroke-width="3"/>
