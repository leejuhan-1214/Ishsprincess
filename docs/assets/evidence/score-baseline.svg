<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">공개 표의 태우 행만 reference=TAEWOO-S27이다. 나머지 학생은 공통 기준 REF-01을 쓴다. 자기 기록과 </text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">비교한 99는 공통 기준 점수가 아니다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
