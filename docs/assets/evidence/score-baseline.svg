<title id="title">개인 기준 파일</title><desc id="description">공개 표의 태우 행만 reference=TAEWOO-S27이다. 나머지 학생은 공통 기준 REF-01을 쓴다. 자기 기록과 비교한 99는 공통 기준 점수가 아니다.</desc>
