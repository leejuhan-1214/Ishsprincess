<rect x="88" y="194" width="295" height="123" rx="12" fill="#e4eaf1" stroke="#aebfce"/><text x="235" y="267" font-size="30" fill="#252533" font-weight="750" text-anchor="middle">교실</text><rect x="817" y="194" width="295" height="123" rx="12" fill="#e4eaf1" stroke="#aebfce"/><text x="964" y="267" font-size="30" fill="#252533" font-weight="750" text-anchor="middle">도서관</text><line x1="383" y1="257" x2="817" y2="257" stroke="#24639c" stroke-width="5"/><rect x="477" y="221" width="246" height="72" rx="12" fill="#fffdf8" stroke="#24639c"/><text x="600" y="266" font-size="24" fill="#252533" font-weight="750" text-anchor="middle">열 수 있는 보조문</text><rect x="88" y="341" width="498" height="151" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="341" width="7" height="151" rx="2" fill="#24639c" stroke="none"/><text x="112" y="377" font-size="19" fill="#565569" font-weight="700" text-anchor="start">기록 센서 점검</text><text x="112" y="417" font-size="26" fill="#252533" font-weight="750" text-anchor="start">17:20 ~ 17:50</text><rect x="614" y="341" width="498" height="151" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="614" y="341" width="7" height="151" rx="2" fill="#24639c" stroke="none"/><text x="638" y="377" font-size="19" fill="#565569" font-weight="700" text-anchor="start">통행 상태</text><text x="638" y="417" font-size="26" fill="#252533" font-weight="750" text-anchor="start">통행 금지 표시 없음</text>
