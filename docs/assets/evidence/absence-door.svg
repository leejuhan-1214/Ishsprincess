<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">연결문 점검표</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">교실 ↔ 도서관 / 보조문</text>
