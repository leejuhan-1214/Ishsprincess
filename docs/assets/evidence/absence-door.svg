<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">교실과 도서관 사이 보조문은 17:20~17:50 센서 점검 중이었다. 문 자체는 안에서 열 수 있었고 통행 금지</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start"> 표시는 없었다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
