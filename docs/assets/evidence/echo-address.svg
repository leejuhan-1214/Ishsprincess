<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">수신 목록의 범위</title><desc id="description">수신자는 지난주 공개 테스트용 1반 주소록과 일치한다. 주한의 개인 대화나 학생의 비공개 파일에서 추출한 자료는 없다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#a24830" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 05 / ECHO-ADDRESS</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">수신 목록의 범위</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">공개 테스트 주소록</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 05</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#a24830" font-weight="800" text-anchor="start">수신 목록 비교</text>
<rect x="88" y="190" width="498" height="129" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="190" width="7" height="129" rx="2" fill="#a24830" stroke="none"/><text x="112" y="226" font-size="19" fill="#565569" font-weight="700" text-anchor="start">발송 수신 목록</text><text x="112" y="266" font-size="26" fill="#252533" font-weight="750" text-anchor="start">1반 공개 테스트 주소록</text><rect x="614" y="190" width="498" height="129" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="614" y="190" width="7" height="129" rx="2" fill="#a24830" stroke="none"/><text x="638" y="226" font-size="19" fill="#565569" font-weight="700" text-anchor="start">지난주 공개 테스트</text><text x="638" y="266" font-size="26" fill="#252533" font-weight="750" text-anchor="start">주소록과 일치</text><rect x="88" y="348" width="1024" height="76" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="376" font-size="20" fill="#565569" font-weight="700" text-anchor="start">주한 개인 대화</text><text x="353" y="376" font-size="24" fill="#252533" font-weight="650" text-anchor="start">추출 자료 없음</text><rect x="88" y="429" width="1024" height="76" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="457" font-size="20" fill="#565569" font-weight="700" text-anchor="start">학생 비공개 파일</text><text x="353" y="457" font-size="24" fill="#252533" font-weight="650" text-anchor="start">추출 자료 없음</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#a24830" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">수신자는 지난주 공개 테스트용 1반 주소록과 일치한다. 주한의 개인 대화나 학생의 비공개 파일에서 추출</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">한 자료는 없다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
