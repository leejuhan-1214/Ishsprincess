<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">공개 영상은 S-28, 원자료는 84점이다. 태우가 완주한 전날 세션 S-27은 97점이며 두 파일은 별도 ID다.</text>
<text x="76" y="768" font-size="15" fill="#565569" font-weight="500" text-anchor="start">아래 선은 동작 측정의 도식이며 실제 원자료를 재현하지 않습니다.</text>
<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
