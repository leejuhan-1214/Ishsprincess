<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">점검 예외 설정</title><desc id="description">17:10 최현솔이 센서의 점검 예외를 적용했다. 변경은 허가된 점검 범위 안이었지만 학급 안내에 적힌 “모든 통행 기록”을 정정하지 않았다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#24639c" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 03 / ABSENCE-TEST</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">점검 예외 설정</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">센서 설정 / 학급 안내</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 04</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#24639c" font-weight="800" text-anchor="start">점검 예외 설정</text>
<rect x="88" y="196" width="1024" height="68" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="224" font-size="20" fill="#565569" font-weight="700" text-anchor="start">17:10 / 최현솔</text><text x="353" y="224" font-size="24" fill="#252533" font-weight="650" text-anchor="start">센서 점검 예외 적용</text><rect x="88" y="269" width="1024" height="68" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="297" font-size="20" fill="#565569" font-weight="700" text-anchor="start">변경 범위</text><text x="353" y="297" font-size="24" fill="#252533" font-weight="650" text-anchor="start">허가된 점검 범위</text><rect x="88" y="342" width="1024" height="68" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="106" y="370" font-size="20" fill="#565569" font-weight="700" text-anchor="start">학급 안내</text><text x="353" y="370" font-size="24" fill="#252533" font-weight="650" text-anchor="start">모든 통행 기록</text><rect x="88" y="415" width="1024" height="68" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="106" y="443" font-size="20" fill="#565569" font-weight="700" text-anchor="start">안내 정정</text><text x="353" y="443" font-size="24" fill="#252533" font-weight="650" text-anchor="start">정정되지 않음</text><text x="1110" y="530" font-size="18" fill="#24639c" font-weight="750" text-anchor="end">CHANGE LOG</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#24639c" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">17:10 최현솔이 센서의 점검 예외를 적용했다. 변경은 허가된 점검 범위 안이었지만 학급 안내에 적힌 “모</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">든 통행 기록”을 정정하지 않았다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
