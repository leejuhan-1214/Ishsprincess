<rect x="88" y="190" width="1024" height="330" rx="12" fill="#282534" stroke="#65566c"/><text x="117" y="232" font-size="26" fill="#fff" font-weight="750" text-anchor="start">순위 표 내보내기 · 16:22</text><rect x="112" y="256" width="477" height="159" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="112" y="256" width="7" height="159" rx="2" fill="#946011" stroke="none"/><text x="136" y="292" font-size="19" fill="#565569" font-weight="700" text-anchor="start">reference</text><text x="136" y="332" font-size="26" fill="#252533" font-weight="750" text-anchor="start">개인 기록 기준</text><rect x="616" y="256" width="471" height="159" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="256" width="7" height="159" rx="2" fill="#946011" stroke="none"/><text x="640" y="292" font-size="19" fill="#565569" font-weight="700" text-anchor="start">공개 설명</text><text x="640" y="332" font-size="26" fill="#252533" font-weight="750" text-anchor="start">동일 기준</text><text x="117" y="477" font-size="25" fill="#f4e8cb" font-weight="700" text-anchor="start">원자료 변경 없음</text><text x="1084" y="477" font-size="22" fill="#f4e8cb" font-weight="750" text-anchor="end">EXPORT</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#946011" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">태우는 기준이 개인 기록인 화면을 보고 16:22 순위 표를 내보냈다. 설명의 “동일 기준” 문구는 유지됐다</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">. 원자료에는 손대지 않았다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
