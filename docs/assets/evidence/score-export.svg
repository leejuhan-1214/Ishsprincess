<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">내보내기 화면 녹화</title><desc id="description">태우는 기준이 개인 기록인 화면을 보고 16:22 순위 표를 내보냈다. 설명의 “동일 기준” 문구는 유지됐다. 원자료에는 손대지 않았다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#946011" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 02 / SCORE-EXPORT</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">내보내기 화면 녹화</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">순위 표 공개 화면</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 04</text>
