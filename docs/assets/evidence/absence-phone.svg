<rect x="116" y="185" width="277" height="338" rx="25" fill="#262635" stroke="#67677a"/><rect x="130" y="217" width="249" height="273" rx="10" fill="#f4f0f4" stroke="none"/><rect x="181" y="269" width="138" height="55" rx="3" fill="none" stroke="#a24830"/><rect x="319" y="286" width="11" height="21" rx="1" fill="#a24830" stroke="none"/><text x="250" y="313" font-size="28" fill="#a24830" font-weight="800" text-anchor="middle">0%</text><text x="250" y="367" font-size="40" fill="#252533" font-weight="800" text-anchor="middle">17:18</text><text x="250" y="412" font-size="24" fill="#565569" font-weight="750" text-anchor="middle">전원 꺼짐</text><rect x="447" y="215" width="665" height="81" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="465" y="243" font-size="20" fill="#565569" font-weight="700" text-anchor="start">17:18</text><text x="666.45" y="243" font-size="24" fill="#252533" font-weight="650" text-anchor="start">배터리 소진 / 전원 꺼짐</text><rect x="447" y="301" width="665" height="81" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="465" y="329" font-size="20" fill="#565569" font-weight="700" text-anchor="start">직접 확인</text><text x="666.45" y="329" font-size="24" fill="#252533" font-weight="650" text-anchor="start">황민혁 · 이서율</text><rect x="447" y="387" width="665" height="81" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="465" y="415" font-size="20" fill="#565569" font-weight="700" text-anchor="start">메시지 도착</text><text x="666.45" y="415" font-size="24" fill="#252533" font-weight="650" text-anchor="start">배터리 소진보다 나중</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#24639c" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">민혁의 휴대폰은 17:18에 배터리가 소진됐다. 마지막 충전 알림을 민혁과 서율이 함께 확인했으며 메시지는</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start"> 그보다 나중에 도착했다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
