<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">꺼진 휴대폰</title><desc id="description">민혁의 휴대폰은 17:18에 배터리가 소진됐다. 마지막 충전 알림을 민혁과 서율이 함께 확인했으며 메시지는 그보다 나중에 도착했다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#24639c" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 03 / ABSENCE-PHONE</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">꺼진 휴대폰</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">마지막 배터리 알림</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 06</text>
