<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">포스터 편집 이력</title><desc id="description">15:02 서율이 동기화 사본에서 문장을 가져와 포스터에 삽입하고 15:20 공개본을 내보냈다. 자동 삽입 기능은 사용되지 않았다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#177766" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 04 / POEM-LAYOUT</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">포스터 편집 이력</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">작업 폴더 사본 / 전시 공개</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 05</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#177766" font-weight="800" text-anchor="start">포스터 편집 이력</text>
<rect x="88" y="191" width="304" height="319" rx="2" fill="#f1eee4" stroke="#bcb6a7"/><text x="240" y="231" font-size="23" fill="#252533" font-weight="750" text-anchor="middle">전시 포스터</text><rect x="174" y="270" width="124" height="88" rx="6" fill="none" stroke="#766d79"/><line x1="170" y1="358" x2="302" y2="358" stroke="#766d79" stroke-width="6"/><line x1="181" y1="358" x2="172" y2="403" stroke="#766d79" stroke-width="5"/><line x1="291" y1="358" x2="301" y2="403" stroke="#766d79" stroke-width="5"/><text x="240" y="450" font-size="20" fill="#565569" font-weight="700" text-anchor="middle">시 본문 비공개</text><rect x="419" y="218" width="693" height="80" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="437" y="246" font-size="20" fill="#565569" font-weight="700" text-anchor="start">15:02 / 이서율</text><text x="647.69" y="246" font-size="24" fill="#252533" font-weight="650" text-anchor="start">동기화 사본의 문장을 직접 삽입</text><rect x="419" y="303" width="693" height="80" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="437" y="331" font-size="20" fill="#565569" font-weight="700" text-anchor="start">15:20</text><text x="647.69" y="331" font-size="24" fill="#252533" font-weight="650" text-anchor="start">공개본 내보내기</text><rect x="419" y="388" width="693" height="80" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="437" y="416" font-size="20" fill="#565569" font-weight="700" text-anchor="start">자동 삽입</text><text x="647.69" y="416" font-size="24" fill="#252533" font-weight="650" text-anchor="start">사용되지 않음</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#177766" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">15:02 서율이 동기화 사본에서 문장을 가져와 포스터에 삽입하고 15:20 공개본을 내보냈다. 자동 삽입 기</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">능은 사용되지 않았다.</text>
<text x="76" y="768" font-size="15" fill="#565569" font-weight="500" text-anchor="start">포스터 그림은 빈 의자를 나타낸 도식입니다. 시 구절은 재게시하지 않습니다.</text>
<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
