<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">작년 시연용 문장</title><desc id="description">작년 발표 자료에 익명 메시지의 표현이 그대로 적혀 있다. 민혁의 이름과 “순서를 지켜”는 가상 인물 필드의 시험값이었다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#a24830" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 05 / ECHO-TEMPLATE</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">작년 시연용 문장</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">위험한 메시지 구별 교육 예시</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 03</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#a24830" font-weight="800" text-anchor="start">작년 발표의 시연 자료</text>
<rect x="88" y="190" width="1024" height="331" rx="2" fill="#fffdf8" stroke="#c4b7a5"/><rect x="109" y="214" width="193" height="31" rx="2" fill="#eee0c8" stroke="none"/><text x="127" y="237" font-size="19" fill="#252533" font-weight="750" text-anchor="start">교육용 시연</text><rect x="109" y="261" width="981" height="56" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="127" y="289" font-size="20" fill="#565569" font-weight="700" text-anchor="start">예시 문장</text><text x="374" y="289" font-size="24" fill="#252533" font-weight="650" text-anchor="start">발표를 포기하지 않으면 비밀을 공개한다.</text><rect x="109" y="322" width="981" height="56" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="127" y="350" font-size="20" fill="#565569" font-weight="700" text-anchor="start">가상 인물 필드</text><text x="374" y="350" font-size="24" fill="#252533" font-weight="650" text-anchor="start">황민혁 / 순서를 지켜</text><rect x="109" y="383" width="981" height="56" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="127" y="411" font-size="20" fill="#565569" font-weight="700" text-anchor="start">표현 비교</text><text x="374" y="411" font-size="24" fill="#252533" font-weight="650" text-anchor="start">익명 메시지와 같은 표현</text><rect x="109" y="444" width="981" height="56" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="127" y="472" font-size="20" fill="#565569" font-weight="700" text-anchor="start">자료의 안내</text><text x="374" y="472" font-size="24" fill="#252533" font-weight="650" text-anchor="start">실제 전송은 중지</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#a24830" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">작년 발표 자료에 익명 메시지의 표현이 그대로 적혀 있다. 민혁의 이름과 “순서를 지켜”는 가상 인물 필</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">드의 시험값이었다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
