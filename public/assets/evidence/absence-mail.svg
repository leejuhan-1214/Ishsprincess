<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">반장 이름의 알림 헤더</title><desc id="description">17:36 메시지는 민혁의 휴대폰이 아니라 교실 공용 PC의 예약 작업에서 생성됐다. 표시 이름은 자유롭게 설정된 문자열이다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#24639c" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 03 / ABSENCE-MAIL</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">반장 이름의 알림 헤더</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">알림 헤더 확인</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 05</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#24639c" font-weight="800" text-anchor="start">메시지 표시 / 실제 발신</text>
<rect x="88" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="192" width="7" height="143" rx="2" fill="#24639c" stroke="none"/><text x="112" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">17:36 / 표시 이름</text><text x="112" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">황민혁</text><rect x="616" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="192" width="7" height="143" rx="2" fill="#24639c" stroke="none"/><text x="640" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">생성 위치</text><text x="640" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">교실 공용 PC 예약 작업</text><rect x="88" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="353" width="7" height="143" rx="2" fill="#24639c" stroke="none"/><text x="112" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">표시 이름 필드</text><text x="112" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">자유롭게 설정 가능한 문자열</text><rect x="616" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="353" width="7" height="143" rx="2" fill="#24639c" stroke="none"/><text x="640" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">개인 발신 서명</text><text x="640" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">인증된 서명 없음</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#24639c" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">17:36 메시지는 민혁의 휴대폰이 아니라 교실 공용 PC의 예약 작업에서 생성됐다. 표시 이름은 자유롭게 </text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">설정된 문자열이다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
