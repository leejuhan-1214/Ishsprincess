<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">책갈피 초안 원본</title><desc id="description">태훈의 비공개 시 초안이다. 14:10 작성 시각과 세 번의 수정 이력이 있으며 포스터의 문장·줄바꿈·특이한 오자가 동일하다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#177766" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 04 / POEM-ORIGINAL</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">책갈피 초안 원본</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">개인 메모 / 수정 흔적</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 01</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#177766" font-weight="800" text-anchor="start">책갈피의 비공개 시 초안</text>
<rect x="88" y="191" width="453" height="319" rx="2" fill="#fffdf8" stroke="#c2baaa"/><rect x="110" y="191" width="32" height="149" rx="0" fill="#177766" stroke="none"/><text x="168" y="237" font-size="26" fill="#252533" font-weight="750" text-anchor="start">비공개 시 초안</text><text x="168" y="278" font-size="21" fill="#565569" font-weight="650" text-anchor="start">본문 재게시 안 함</text><line x1="168" y1="322" x2="479" y2="322" stroke="#ccc4b6" stroke-width="8"/><line x1="168" y1="360" x2="400" y2="360" stroke="#ccc4b6" stroke-width="8"/><line x1="168" y1="398" x2="479" y2="398" stroke="#ccc4b6" stroke-width="8"/><line x1="168" y1="436" x2="400" y2="436" stroke="#ccc4b6" stroke-width="8"/><rect x="569" y="201" width="543" height="67" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="587" y="229" font-size="20" fill="#565569" font-weight="700" text-anchor="start">작성 시각</text><text x="748.19" y="229" font-size="24" fill="#252533" font-weight="650" text-anchor="start">14:10</text><rect x="569" y="273" width="543" height="67" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="587" y="301" font-size="20" fill="#565569" font-weight="700" text-anchor="start">수정 이력</text><text x="748.19" y="301" font-size="24" fill="#252533" font-weight="650" text-anchor="start">세 번의 수정</text><rect x="569" y="345" width="543" height="67" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="587" y="373" font-size="20" fill="#565569" font-weight="700" text-anchor="start">포스터와 비교</text><text x="748.19" y="373" font-size="24" fill="#252533" font-weight="650" text-anchor="start">문장 · 줄바꿈 · 특이한 오</text><text x="748.19" y="402" font-size="24" fill="#252533" font-weight="650" text-anchor="start">자 동일</text><rect x="569" y="417" width="543" height="67" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="587" y="445" font-size="20" fill="#565569" font-weight="700" text-anchor="start">공개 범위</text><text x="748.19" y="445" font-size="24" fill="#252533" font-weight="650" text-anchor="start">비공개 초안</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#177766" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">태훈의 비공개 시 초안이다. 14:10 작성 시각과 세 번의 수정 이력이 있으며 포스터의 문장·줄바꿈·특이</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">한 오자가 동일하다.</text>
<text x="76" y="768" font-size="15" fill="#565569" font-weight="500" text-anchor="start">비공개 시의 실제 구절은 그림에 재게시하지 않습니다.</text>
<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
