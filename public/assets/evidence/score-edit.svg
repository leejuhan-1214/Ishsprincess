<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">16:18 태우가 담당 계정으로 자신의 reference만 바꿨다. 변경 전 공통 기준 점수는 84. 권한 있는 설정</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">이지만 공정한 비교를 위한 변경은 아니었다.</text>

