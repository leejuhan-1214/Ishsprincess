<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">공통 기준 재계산</title><desc id="description">교사 승인하에 공통 REF-01로 재계산하면 모든 행이 원자료와 일치한다. 센서 고장은 확인되지 않았다. 점수는 동작 미학을 평가하지 않는다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#946011" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 02 / SCORE-RECHECK</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">공통 기준 재계산</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">담당 교사 승인</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 05</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#946011" font-weight="800" text-anchor="start">공통 기준 재계산</text>
<rect x="88" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="192" width="7" height="143" rx="2" fill="#946011" stroke="none"/><text x="112" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">재계산 기준</text><text x="112" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">모든 행에 REF-01 적용</text><rect x="616" y="192" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="192" width="7" height="143" rx="2" fill="#946011" stroke="none"/><text x="640" y="228" font-size="19" fill="#565569" font-weight="700" text-anchor="start">결과</text><text x="640" y="268" font-size="26" fill="#252533" font-weight="750" text-anchor="start">모든 행이 원자료와 일치</text><rect x="88" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="88" y="353" width="7" height="143" rx="2" fill="#946011" stroke="none"/><text x="112" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">센서 고장</text><text x="112" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">확인되지 않음</text><rect x="616" y="353" width="498" height="143" rx="12" fill="#fffdf8" stroke="#cfc8d3"/><rect x="616" y="353" width="7" height="143" rx="2" fill="#946011" stroke="none"/><text x="640" y="389" font-size="19" fill="#565569" font-weight="700" text-anchor="start">평가 범위</text><text x="640" y="429" font-size="26" fill="#252533" font-weight="750" text-anchor="start">좌표 차이 / 동작 미학은 평가하지 </text><text x="640" y="463" font-size="26" fill="#252533" font-weight="750" text-anchor="start">않음</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#946011" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">교사 승인하에 공통 REF-01로 재계산하면 모든 행이 원자료와 일치한다. 센서 고장은 확인되지 않았다. 점</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">수는 동작 미학을 평가하지 않는다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
