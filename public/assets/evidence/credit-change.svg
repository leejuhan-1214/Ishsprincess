<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">16:42 크레딧 레이어만 수정됐다. 로그인 표시는 BAND-SHARED이며, 이주한 개인 계정과 다른 공용 계정이</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
