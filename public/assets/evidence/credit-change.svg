<rect x="88" y="194" width="294" height="303" rx="12" fill="#282534" stroke="#403948"/><text x="109" y="230" font-size="23" fill="#fff" font-weight="750" text-anchor="start">편집기 레이어</text><rect x="110" y="249" width="249" height="65" rx="12" fill="#54465f" stroke="none"/><text x="128" y="290" font-size="22" fill="#fff" font-weight="500" text-anchor="start">음원 · 그대로</text><rect x="110" y="334" width="249" height="99" rx="12" fill="#68344d" stroke="#ce2b6a"/><text x="128" y="373" font-size="21" fill="#fff" font-weight="700" text-anchor="start">크레딧 레이어</text><text x="128" y="408" font-size="23" fill="#ffd1e2" font-weight="750" text-anchor="start">16:42 수정</text><rect x="409" y="194" width="703" height="67" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="427" y="222" font-size="20" fill="#565569" font-weight="700" text-anchor="start">16:42</text><text x="640.99" y="222" font-size="24" fill="#252533" font-weight="650" text-anchor="start">크레딧 레이어 수정</text><rect x="409" y="266" width="703" height="67" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="427" y="294" font-size="20" fill="#565569" font-weight="700" text-anchor="start">로그인 표시</text><text x="640.99" y="294" font-size="24" fill="#252533" font-weight="650" text-anchor="start">BAND-SHARED</text><rect x="409" y="338" width="703" height="67" rx="6" fill="#f0edf1" stroke="#d8d4dd"/><text x="427" y="366" font-size="20" fill="#565569" font-weight="700" text-anchor="start">음원 레이어</text><text x="640.99" y="366" font-size="24" fill="#252533" font-weight="650" text-anchor="start">변경 없음</text><rect x="409" y="410" width="703" height="67" rx="6" fill="#faf8f3" stroke="#d8d4dd"/><text x="427" y="438" font-size="20" fill="#565569" font-weight="700" text-anchor="start">개인 계정 여부</text><text x="640.99" y="438" font-size="24" fill="#252533" font-weight="650" text-anchor="start">이주한 개인 계정과 다름</text>
