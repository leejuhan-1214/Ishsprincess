<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">미리보기 시간대 설정</title><desc id="description">영상 화면의 17:42는 편집기 표시 시간이다. 저장 기록과 같은 순간이며 표시 설정만 한 시간 빠르다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#ce2b6a" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 01 / CREDIT-CLOCK</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">미리보기 시간대 설정</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">미리보기 시간대 설정</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 06</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#ce2b6a" font-weight="800" text-anchor="start">화면 시각 / 저장 시각</text>
<rect x="88" y="191" width="498" height="220" rx="12" fill="#fffdf8" stroke="#cec8d3"/><text x="337" y="236" font-size="25" fill="#565569" font-weight="700" text-anchor="middle">편집기 표시</text><text x="337" y="342" font-size="77" fill="#8a325b" font-weight="800" text-anchor="middle">17:42</text><rect x="616" y="191" width="498" height="220" rx="12" fill="#fffdf8" stroke="#cec8d3"/><text x="865" y="236" font-size="25" fill="#565569" font-weight="700" text-anchor="middle">실제 저장</text><text x="865" y="342" font-size="77" fill="#ce2b6a" font-weight="800" text-anchor="middle">16:42</text><text x="600" y="460" font-size="30" fill="#252533" font-weight="750" text-anchor="middle">같은 순간 · 표시 설정만 +1시간</text><text x="600" y="506" font-size="22" fill="#565569" font-weight="550" text-anchor="middle">기준 시각을 맞추어 비교</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#ce2b6a" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">영상 화면의 17:42는 편집기 표시 시간이다. 저장 기록과 같은 순간이며 표시 설정만 한 시간 빠르다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
