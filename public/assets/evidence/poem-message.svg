<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">인용 전 대화</title><desc id="description">서율이 “지금 시를 넣어도 돼?”라고 물었고 태훈은 “지금 초안은 아니야. 새로 완성해서 줄게”라고 답했다. 두 사람 동의로 이 관련 구간만 제출됐다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}text{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#e9e7e3" stroke="none"/>
<rect x="0" y="0" width="1200" height="126" rx="0" fill="#201e2c" stroke="none"/><rect x="0" y="0" width="10" height="126" rx="0" fill="#177766" stroke="none"/>
<text x="48" y="33" font-size="17" fill="#e4d3de" font-weight="750" text-anchor="start">CASE 04 / POEM-MESSAGE</text>
<text x="48" y="79" font-size="35" fill="#fffaf0" font-weight="800" text-anchor="start">인용 전 대화</text><text x="48" y="109" font-size="18" fill="#e1d9e1" font-weight="600" text-anchor="start">두 사람 동의로 제출된 구간</text>
<text x="1152" y="44" font-size="20" fill="#ffe9a1" font-weight="750" text-anchor="end">자료 04</text>
<rect x="48" y="148" width="1104" height="407" rx="12" fill="#fffdf8" stroke="#c9c2cb"/><text x="88" y="178" font-size="22" fill="#177766" font-weight="800" text-anchor="start">인용 전 관련 대화</text>
<rect x="88" y="191" width="1024" height="322" rx="12" fill="#e9eeed" stroke="#b6c7bf"/><text x="111" y="231" font-size="22" fill="#565569" font-weight="750" text-anchor="start">이서율</text><rect x="111" y="248" width="677" height="64" rx="12" fill="#fffdf8" stroke="#c5d3cd"/><text x="135" y="290" font-size="29" fill="#252533" font-weight="700" text-anchor="start">지금 시를 넣어도 돼?</text><text x="1087" y="348" font-size="22" fill="#565569" font-weight="750" text-anchor="end">고태훈</text><rect x="269" y="365" width="818" height="79" rx="12" fill="#dcece4" stroke="#a7bdaf"/><text x="294" y="414" font-size="28" fill="#252533" font-weight="750" text-anchor="start">지금 초안은 아니야. 새로 완성해서 줄게.</text><text x="600" y="488" font-size="21" fill="#565569" font-weight="650" text-anchor="middle">동의받은 관련 구간만 제출 · 다른 대화 제외</text>
<rect x="48" y="575" width="1104" height="212" rx="12" fill="#faf8f4" stroke="#ccc5cd"/><text x="76" y="610" font-size="19" fill="#177766" font-weight="800" text-anchor="start">관찰 내용</text>
<text x="76" y="645" font-size="20" fill="#252533" font-weight="550" text-anchor="start">서율이 “지금 시를 넣어도 돼?”라고 물었고 태훈은 “지금 초안은 아니야. 새로 완성해서 줄게”라고 답</text><text x="76" y="672" font-size="20" fill="#252533" font-weight="550" text-anchor="start">했다. 두 사람 동의로 이 관련 구간만 제출됐다.</text>

<text x="600" y="809" font-size="13" fill="#565569" font-weight="500" text-anchor="middle">게임 내 가상 자료 · 실제 인물이나 학교의 기록이 아닙니다.</text>
</svg>
