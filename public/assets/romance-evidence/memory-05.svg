<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">E05 엇갈린 리허설 공지 원문</title><desc id="desc">16시 40분 같은 모임을 준비 지원에는 컴퓨터실, 밴드에는 밴드연습실, 댄스에는 강당으로 안내한 세 공지. 표시명은 리허설 자동안내, 얼터에고 테스트로 동일하다.</desc>
<rect width="1200" height="820" fill="#e7e2e0"/><rect width="1200" height="153" fill="#292436"/>
<g font-family="Noto Sans KR,Malgun Gothic,sans-serif" fill="#302738">
<text x="63" y="46" font-size="18" letter-spacing="3" fill="#f7d687">마음의 기록 / E05</text><text x="63" y="94" font-size="35" font-weight="900" fill="#fff5e8">같은 모임, 세 개의 장소</text><text x="63" y="130" font-size="19" fill="#d7c8e4">공용 게시판에 남은 안내 원문 · 친구들이 직접 비교한 화면</text>
<g fill="#fffcf5" stroke="#b2a1bb" stroke-width="2"><rect x="61" y="183" width="1078" height="141" rx="9"/><rect x="61" y="350" width="1078" height="141" rx="9"/><rect x="61" y="517" width="1078" height="141" rx="9"/></g>
<g font-size="18" fill="#786281"><text x="87" y="216">리허설 자동안내(얼터에고 테스트)</text><text x="87" y="383">리허설 자동안내(얼터에고 테스트)</text><text x="87" y="550">리허설 자동안내(얼터에고 테스트)</text></g>
<g font-size="23"><text x="87" y="257">받는 모둠 · 준비 지원</text><text x="87" y="424">받는 모둠 · 밴드</text><text x="87" y="591">받는 모둠 · 댄스</text></g>
<g font-size="29" font-weight="800"><text x="87" y="300">합동 준비 모임: 컴퓨터실로 오세요.</text><text x="87" y="467">합동 준비 모임: 밴드연습실로 오세요.</text><text x="87" y="634">합동 준비 모임: 강당으로 오세요.</text></g>
<g fill="#9d476a" font-family="monospace" font-size="46" font-weight="800"><text x="932" y="274">16:40</text><text x="932" y="441">16:40</text><text x="932" y="608">16:40</text></g>
<text x="62" y="709" font-size="22" font-weight="700">표시 이름이 같아도, 그 프로그램이 작성했다고 단정할 수 없다.</text><text x="62" y="746" font-size="18" fill="#786780">확인 범위: 공용 안내의 제목·내용·수신 모둠. 개인 대화는 포함하지 않음.</text><text x="62" y="788" font-size="16" fill="#8a7c91">게임 속 가상 자료 · 게시판에서 보존한 원문 비교</text>
</g></svg>
